<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星锁 StarLock 在线体验 · 八种验证码交互演示</title>
  <meta name="description" content="直接试玩星锁 StarLock 的圆环旋转、曲线拼图、变速滑块、文字顺序点选、语义九宫格、数字、字符和算术验证码。浏览器内演示，支持换题、键盘微调与手机弹窗。" />
  <link rel="icon" href="/src/logo.svg" type="image/svg+xml" />
</head>
<body>
  <header class="header">
    <a class="brand" href="../"><img src="/src/logo.svg" alt="星锁 Logo" width="36" height="36" /><strong>StarLock<span>星锁交互体验</span></strong></a>
    <nav aria-label="导航"><a href="../">项目介绍 ↗</a><a href="https://github.com/StarDreamTech/starlock/blob/main/docs/integration.md">开发接入 ↗</a></nav>
  </header>
  <main>
    <section class="playground" aria-labelledby="demo-title">
      <div class="intro">
        <p class="eyebrow">STARLOCK PLAYGROUND</p>
        <h1 id="demo-title">亲手试试<br /><em>星锁。</em></h1>
        <p class="description">选一种方式，在弹窗里开始。</p>
        <div id="types" class="type-grid" role="group" aria-label="选择验证码类型">
          <button data-kind="rotate" aria-pressed="true"><strong>圆环旋转</strong><span>转动内圈，恢复画面</span><i aria-hidden="true">↗</i></button>
          <button data-kind="bezier_slider" aria-pressed="false"><strong>曲线拼图</strong><span>沿曲线，找准位置与角度</span><i aria-hidden="true">↗</i></button>
          <button data-kind="slider" aria-pressed="false"><strong>变速滑块</strong><span>直线移动，变速旋转</span><i aria-hidden="true">↗</i></button>
          <button data-kind="text_click" aria-pressed="false"><strong>文字点选</strong><span>依次找出题目指定的文字</span><i aria-hidden="true">↗</i></button>
          <button data-kind="semantic_grid" aria-pressed="false"><strong>语义九宫格</strong><span>读懂问题，选择符合的图片</span><i aria-hidden="true">↗</i></button>
          <button data-kind="digits" aria-pressed="false"><strong>数字验证</strong><span>读出图中的数字</span><i aria-hidden="true">↗</i></button>
          <button data-kind="text" aria-pressed="false"><strong>字符验证</strong><span>识别字母与数字</span><i aria-hidden="true">↗</i></button>
          <button data-kind="arithmetic" aria-pressed="false"><strong>算术验证</strong><span>解一道简单算式</span><i aria-hidden="true">↗</i></button>
        </div>
        <p class="demo-note">浏览器内交互演示，正式接入通过服务端校验。</p>
        <noscript><p>开启 JavaScript 后即可体验验证码。</p></noscript>
      </div>
      <div class="art-panel">
        <img class="art" src="../../assets/brand/starlock-hero-v2.webp" alt="星锁紫色玻璃锁体与四角星锁孔" width="1600" height="800" />
        <div class="art-shade"></div>
        <div class="experience-result"><span id="result" role="status" aria-live="polite">正在准备圆环旋转题…</span><button id="retry" disabled>再试一次 ↗</button></div>
      </div>
    </section>
    <div id="widget"></div>
  </main>
  <footer><span>星梦科技 StarDreamTech</span><a href="https://github.com/StarDreamTech/starlock">查看源码 ↗</a><a href="./THIRD_PARTY_NOTICES.txt">开源许可</a><a href="/llms.txt">项目资料</a></footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
